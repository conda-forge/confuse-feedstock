{% set name = "confuse" %}
{% set version = "2.3.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: b51cd33c36319cf8ab4bade81d16df3e7135af01ffa3f51a60e131b9d5156cd3

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - flit-core >=2,<4
    - poetry-core >=2.1
    - poethepoet >=0.32
  run:
    - python >={{ python_min }}
    - pyyaml
    - typing_extensions

test:
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip
  imports:
    - confuse


about:
  home: https://github.com/beetbox/confuse
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: painless YAML configuration

  description: |
    Confuse is a configuration library for Python that uses YAML.
    It takes care of defaults, overrides, type checking, command-line
    integration, human-readable errors, and standard OS-specific locations.
  doc_url: http://confuse.readthedocs.org/
  dev_url: https://github.com/beetbox/confuse

extra:
  recipe-maintainers:
    - philip-khor
